apiVersion: apps/v1
kind: Deployment

metadata:
  name: seclock

spec:
  replicas: 2

  selector:
    matchLabels:
      app: seclock

  template:
    metadata:
      labels:
        app: seclock

    spec:
      containers:
        - name: seclock

          image: 669960693352.dkr.ecr.us-east-1.amazonaws.com/aws-website:latest

          ports:
            - containerPort: 8000

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
